name: Build Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify Lua logic with simulated engine interfaces
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          python tests/test_success_chain.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_tap_motion.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify panel and deployment
        shell: pwsh
        run: ./build.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release
      - name: Publish tagged build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --generate-notes --title "$TAG"
